<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Frequência">
<meta name="theme-color" content="#0a6f8a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Frequência da Natação</title>
<style>
:root{--bg:#eef6f8;--fg:#0d2b3a;--card:#fff;--mut:#5b7583;--ac:#0a6f8a;--acfg:#fff;--bd:#cfe0e6;--sel:#d6eef4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a22;--fg:#e4f1f5;--card:#12272f;--mut:#8fa9b5;--ac:#3cc0dc;--acfg:#06212a;--bd:#23404a;--sel:#17414d}}
:root[data-theme="dark"]{--bg:#0b1a22;--fg:#e4f1f5;--card:#12272f;--mut:#8fa9b5;--ac:#3cc0dc;--acfg:#06212a;--bd:#23404a;--sel:#17414d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--fg);font:16px/1.4 "Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;max-width:760px;padding:12px 14px 40px}
h1{font-size:22px;margin:6px 0 10px}
nav{display:flex;gap:6px;margin-bottom:14px}
nav button{flex:1;padding:7px 1px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;font:inherit;font-size:12px}
nav button.on{background:var(--ac);color:var(--acfg);border-color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px;width:100%}
.row{display:flex;gap:8px;align-items:center}
.btn{padding:9px 12px;border:1px solid var(--ac);background:var(--ac);color:var(--acfg);border-radius:8px;font:inherit;font-weight:600}
.btn.ghost{background:transparent;color:var(--ac)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.name{font-weight:600;margin-bottom:8px}
.brg{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:8px}
.brg button{padding:8px 0;border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:8px;font:inherit;font-size:14px}
.brg button.on{background:var(--ac);color:var(--acfg);border-color:var(--ac);font-weight:700}
.det{margin-top:6px;border-top:1px solid var(--bd);padding-top:10px}
.lnk{background:none;border:0;color:var(--ac);font:inherit;font-size:14px;padding:8px 0 0}
.spark{display:flex;align-items:flex-end;gap:3px;height:60px}
.spark i{flex:1;background:var(--ac);border-radius:2px 2px 0 0;min-width:4px}
.wrap{white-space:normal;text-align:left;min-width:150px}
.sym{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.sym button{padding:8px 0;font-size:18px;border:1px solid var(--bd);background:var(--bg);border-radius:8px}
.sym button.on{background:var(--sel);border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.mut{color:var(--mut);font-size:14px}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--mut);margin:8px 0 12px}
.rk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.rk:last-child{border:0}
.pos{width:34px;text-align:center;font-weight:700;font-size:18px}
.pct{margin-left:auto;font-weight:700;font-size:18px;color:var(--ac)}
.bar{height:6px;background:var(--bd);border-radius:3px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.grow{flex:1;min-width:0}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:10px}
table{border-collapse:collapse;font-size:13px}
td,th{padding:7px 5px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}
.fx{position:sticky;left:0;background:var(--card);text-align:left;font-weight:600;max-width:105px;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--bd)}
.good{color:#1a8a4a}.bad{color:#c0392b}
@media (prefers-color-scheme:dark){.good{color:#5fd38d}.bad{color:#ff8a80}}
</style>
</head>
<body>
<h1>🏊 Frequência da equipe</h1>
<nav id="nav"></nav>
<main id="main"></main>

<script>
var SYM={C:['✅','Completo'],I:['🟡','Incompleto'],F:['❌','Falta'],P:['🏆','Competição'],D:['💤','Descanso'],H:['🎉','Feriado'],S:['🤒','Doença/lesão']};
var KEYS=Object.keys(SYM);
var COL={C:[.62,.85,.66],I:[.99,.9,.5],F:[.96,.6,.6],P:[.6,.78,.96],D:[.85,.85,.85],H:[.8,.7,.9],S:[.98,.75,.55]};
var S={a:[],r:{}};
try{var raw=localStorage.getItem('freq-natacao');if(raw){S=JSON.parse(raw)}}catch(e){}
S.n=S.n||{};S.p=S.p||[];migE();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
function save(){try{localStorage.setItem('freq-natacao',JSON.stringify(S))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function p2(n){return String(n).padStart(2,'0')}
function ds(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function pd(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function fp(p){return p===null?'-':p.toFixed(1).replace('.',',')+'%'}
function cut(s,n){return s.length>n?s.slice(0,n-1)+'.':s}
var tab='chamada',date=ds(new Date()),per='ano',year=new Date().getFullYear(),mon=date.slice(0,7),openId=null,viewId=null,backTab='atletas';
var BL=['','Muito leve','Leve','Moderado','Um pouco forte','Forte','Forte','Muito forte','Muito forte','Quase máximo','Máximo'];
var TABS=[['chamada','Chamada','✅'],['freq','Frequência','📊'],['provas','Resultados','🏁'],['atletas','Atletas','👥']];

function shift(n){var d=pd(date);d.setDate(d.getDate()+n);date=ds(d);render()}
function setCode(id,k){var d=S.r[date]||(S.r[date]={});if(d[id]===k)delete d[id];else d[id]=k;if(!Object.keys(d).length)delete S.r[date];save();render()}
function markAll(k,gk){if(!S.a.length)return;var d=S.r[date]=S.r[date]||{};S.a.forEach(function(a){if(gk&&grpOf(a,+date.slice(0,4))!==gk)return;if(k!=='C'||!d[a.id])d[a.id]=k});save();render()}
function getN(dt,id){return (S.n[dt]||{})[id]||{}}
function putN(dt,id,f,v){var d=S.n[dt]||(S.n[dt]={}),e=d[id]||(d[id]={});if(v===null||v===undefined)delete e[f];else e[f]=v;if(!Object.keys(e).length)delete d[id];if(!Object.keys(d).length)delete S.n[dt];save()}
function setBorg(id,v){putN(date,id,'b',getN(date,id).b===v?null:v);render()}
function setObs(id,v){putN(date,id,'o',v.trim()===''?null:v)}
function toggle(id){openId=openId===id?null:id;render()}
function openAthlete(id){viewId=id;backTab=tab;tab='atleta';render()}
function detPanel(a){
  var n=getN(date,a.id),o=openId===a.id,t='';
  t+='<button class="lnk" onclick="toggle(\''+a.id+'\')">'+(o?'▾':'▸')+' Esforço e observação'+(n.b?' (Borg '+n.b+')':'')+(n.o?' 📝':'')+'</button>';
  if(o){
    t+='<div class="det"><div class="mut">Percepção de esforço (Borg 1–10)'+(n.b?': <b>'+BL[n.b]+'</b>':'')+'</div><div class="brg">';
    for(var i=1;i<=10;i++)t+='<button class="'+(n.b===i?'on':'')+'" onclick="setBorg(\''+a.id+'\','+i+')">'+i+'</button>';
    t+='</div><textarea rows="2" style="margin-top:10px" placeholder="Observações do treino (como se sentiu, se passou mal, qual lesão...)" oninput="setObs(\''+a.id+'\',this.value)">'+esc(n.o||'')+'</textarea></div>';
  }
  return t;
}
function perOpts(){return [['ano','Ano inteiro'],['1','1º trimestre (jan–mar)'],['2','2º trimestre (abr–jun)'],['3','3º trimestre (jul–set)'],['4','4º trimestre (out–dez)']].map(function(p){return '<option value="'+p[0]+'"'+(per===p[0]?' selected':'')+'>'+p[1]+'</option>'}).join('')}
function histRows(id){
  var u={};Object.keys(S.r).concat(Object.keys(S.n)).forEach(function(d){u[d]=1});
  return Object.keys(u).filter(function(d){return inPer(d)}).sort().map(function(dt){var n=(S.n[dt]||{})[id]||{};return {dt:dt,k:(S.r[dt]||{})[id],b:n.b,o:n.o}}).filter(function(e){return e.k||e.b||e.o});
}
function athleteView(){
  var a=S.a.find(function(x){return x.id===viewId});if(!a){tab='atletas';return ''}
  var r=stats(inPer).filter(function(x){return x.a.id===a.id})[0],ev=histRows(a.id);
  var h='<div class="row" style="margin-bottom:10px"><button class="btn ghost" onclick="tab=backTab;render()">‹ Voltar</button><div class="grow"><div class="name" style="margin:0;font-size:18px">'+esc(a.name)+'</div><div class="mut">'+sub(a,year)+'</div></div><button class="btn" onclick="pdfAthlete()">PDF</button></div>';
  h+='<div class="card"><div class="row"><select onchange="per=this.value;render()" style="flex:2">'+perOpts()+'</select><input type="number" value="'+year+'" style="flex:1" onchange="year=+this.value||year;render()"></div>';
  h+='<div style="margin-top:10px"><b>Frequência: '+fp(r.p)+'</b> &nbsp; <span class="mut">'+r.s.C+' ✅ '+r.s.I+' 🟡 '+r.s.F+' ❌ '+r.s.S+' 🤒</span></div>';
  h+='<div class="mut">Borg médio: '+(r.bm===null?'-':r.bm.toFixed(1).replace('.',','))+'</div></div>';
  h+='<button class="btn ghost" style="width:100%;margin-bottom:10px" onclick="gA=\''+a.id+'\';pview=\'geral\';F=null;EF=null;tab=\'provas\';render()">🏁 Evolução em provas ('+S.p.filter(function(x){return x.a===a.id}).length+')</button>';
  var bs=ev.filter(function(e){return e.b}).slice(-20);
  if(bs.length>1)h+='<div class="card"><div class="mut" style="margin-bottom:6px">Esforço (Borg) nos últimos treinos</div><div class="spark">'+bs.map(function(e){return '<i style="height:'+e.b*10+'%"></i>'}).join('')+'</div></div>';
  if(!ev.length)h+='<div class="card mut">Nenhum registro neste período.</div>';
  else h+='<div class="tw"><table><tr><th>Data</th><th>Sit.</th><th>Borg</th><th>Observação</th></tr>'+ev.slice().reverse().map(function(e){return '<tr><td>'+e.dt.slice(8)+'/'+e.dt.slice(5,7)+'</td><td>'+(e.k?SYM[e.k][0]:'')+'</td><td>'+(e.b||'')+'</td><td class="wrap">'+esc(e.o||'')+'</td></tr>'}).join('')+'</table></div>';
  return h;
}
function wrapT(s,n){var l=[],c='';String(s).split(/\s+/).forEach(function(x){if(c&&(c+' '+x).length>n){l.push(c);c=x}else c=(c?c+' ':'')+x});if(c)l.push(c);return l}
function pdfAthlete(){
  var a=S.a.find(function(x){return x.id===viewId});if(!a)return;
  var r=stats(inPer).filter(function(x){return x.a.id===a.id})[0],ev=histRows(a.id),P=mkPDF(595,842),y;
  function head(first){P.page();y=56;
    if(first){P.t(40,y,cut(a.name,40),20,1);P.t(40,y+20,perLabel(),12,0,[.35,.35,.35]);
      P.t(40,y+42,'Frequência: '+fp(r.p)+'     Borg médio: '+(r.bm===null?'-':r.bm.toFixed(1).replace('.',',')),11,1);
      P.t(40,y+58,r.s.C+' completos, '+r.s.I+' incompletos, '+r.s.F+' faltas, '+r.s.S+' doença/lesão, '+r.s.P+' competições',9,0,[.4,.4,.4]);y+=76}
    P.r(40,y,515,20,[.84,.93,.96]);[['Data',46],['Situação',100],['Borg',190],['Observação',230]].forEach(function(k){P.t(k[1],y+14,k[0],9,1)});y+=20}
  head(true);
  ev.forEach(function(e){
    var ls=e.o?wrapT(e.o,68):[''],hh=ls.length*12+8;
    if(y+hh>810)head(false);
    P.t(46,y+14,e.dt.slice(8)+'/'+e.dt.slice(5,7)+'/'+e.dt.slice(0,4),9,0);
    if(e.k){P.r(100,y+5,9,9,COL[e.k]);P.t(113,y+14,SYM[e.k][1],9,0)}
    if(e.b)P.t(194,y+14,e.b,9,1);
    ls.forEach(function(t,i){P.t(230,y+14+i*12,t,9,0)});
    P.l(40,y+hh,555,y+hh);y+=hh});
  sharePDF(P.out(),'frequencia-'+a.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-')+'-'+(per==='ano'?year:year+'-T'+per)+'.pdf');
}
var CATS=[[8,'Pré-mirim'],[9,'Mirim I'],[10,'Mirim II'],[11,'Petiz I'],[12,'Petiz II'],[13,'Infantil I'],[14,'Infantil II'],[15,'Juvenil I'],[16,'Juvenil II'],[17,'Júnior I'],[18,'Júnior II'],[19,'Júnior II']];
function age(b,yr){return b?(yr||new Date().getFullYear())-Number(b.slice(0,4)):null}
function catOf(b,yr){var a=age(b,yr);if(a===null||isNaN(a))return '';if(a<8)return 'Abaixo de 8 anos';if(a>=20)return 'Sênior';for(var i=0;i<CATS.length;i++)if(CATS[i][0]===a)return CATS[i][1];return ''}
function catTxt(b,yr){var a=age(b,yr);return a===null||isNaN(a)?'':catOf(b,yr)+' · '+a+' anos'}
var GRN={g1:'Pré-mirim a Petiz II',g2:'Infantil I a Sênior',sem:'Sem grupo'},GO=['g1','g2','sem'],fg='todos',fs='todos',fsub='tabela';
var CNAMES=['Pré-mirim','Mirim I','Mirim II','Petiz I','Petiz II','Infantil I','Infantil II','Juvenil I','Juvenil II','Júnior I','Júnior II','Sênior'];
function navCur(){var c=tab==='atleta'?backTab:tab;return (c==='tabela'||c==='rank')?'freq':c}
function go(k){tab=k==='freq'?fsub:k;render()}
function autoG(b,yr){var a=age(b,yr);return (a===null||isNaN(a))?'sem':(a<=12?'g1':'g2')}
function grpOf(a,yr){return a.gr||autoG(a.b,yr)}
function lbl(a,yr){var t=[];if(a.b)t.push(catOf(a.b,yr));if(a.st==='pre')t.push('pré-equipe');return t.join(' · ')}
function sub(a,yr){return [a.b?catTxt(a.b,yr):'',a.st==='pre'?'Pré-equipe':''].filter(Boolean).join(' · ')}
function grouped(yr){return GO.map(function(g){return {k:g,list:S.a.filter(function(a){return grpOf(a,yr)===g})}}).filter(function(g){return g.list.length})}
function passF(a,yr){
  if(fs!=='todos'&&(a.st||'fed')!==fs)return false;
  if(fg==='todos')return true;
  if(fg.slice(0,2)==='c:')return catOf(a.b,yr)===fg.slice(2);
  return grpOf(a,yr)===fg}
function fsort(l,yr){return l.filter(function(r){return passF(r.a,yr)}).sort(function(x,y){return GO.indexOf(grpOf(x.a,yr))-GO.indexOf(grpOf(y.a,yr))||x.a.name.localeCompare(y.a.name,'pt-BR')})}
function fopt(v,t){return '<option value="'+v+'"'+(fg===v?' selected':'')+'>'+t+'</option>'}
function filtBar(){
  return '<div class="card g2"><select onchange="fg=this.value;render()"><option value="todos">Todos os grupos</option><optgroup label="Grupos de treino">'+fopt('g1',GRN.g1)+fopt('g2',GRN.g2)+fopt('sem','Sem grupo')+'</optgroup><optgroup label="Categorias">'+CNAMES.map(function(c){return fopt('c:'+c,c)}).join('')+'</optgroup></select><select onchange="fs=this.value;render()"><option value="todos">Federados e pré-equipe</option><option value="fed"'+(fs==='fed'?' selected':'')+'>Só federados</option><option value="pre"'+(fs==='pre'?' selected':'')+'>Só pré-equipe</option></select></div>'}
function fhead(){return '<div class="g2" style="margin-bottom:10px"><button class="btn'+(tab==='tabela'?'':' ghost')+'" onclick="tab=\'tabela\';render()">📅 Mês</button><button class="btn'+(tab==='rank'?'':' ghost')+'" onclick="tab=\'rank\';render()">🏆 Ranking</button></div>'+filtBar()}
var EA=null;
function editA(id){var a=S.a.find(function(x){return x.id===id});EA={id:id,n:a.name,b:a.b||'',st:a.st||'fed',gr:a.gr||''};render();window.scrollTo(0,0)}
function saveA(){if(!EA.n.trim())return alert('Informe o nome.');var a=S.a.find(function(x){return x.id===EA.id});a.name=EA.n.trim();a.b=EA.b||'';a.st=EA.st;a.gr=EA.gr;S.a.sort(function(x,y){return x.name.localeCompare(y.name,'pt-BR')});EA=null;save();render()}
var TIPS={chamada:'Registre a presença do dia: toque no símbolo de cada atleta. Use “Esforço e observação” para anotar o Borg e como ele se sentiu.',tabela:'Mês: quadro com os atletas nas linhas e os dias nas colunas, com o % de frequência no final. Use os filtros para ver um grupo ou categoria.',rank:'Ranking: os mais assíduos do ano ou do trimestre. Filtre por grupo, categoria ou situação. Toque num nome para ver o atleta.',atletas:'Cadastre os atletas com data de nascimento: a categoria e o grupo de treino são calculados sozinhos, e você pode mudar o grupo de quem treina em outro. Pré-equipe não aparece nos resultados de competição.'};
function tipFor(){
  if(tab==='provas'){if(F||EF||pview==='evento')return '';return pview==='geral'?'Evolução do tempo final de um atleta ao longo do ano e as melhores marcas dele.':'Cada competição é um evento: abra um para lançar os tempos e as parciais dos atletas.'}
  return TIPS[tab]||''}
function addAthlete(){var el=document.getElementById('nm');var n=el.value.trim();if(!n)return;S.a.push({id:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:n,b:(document.getElementById('nb')||{}).value||'',st:(document.getElementById('nst')||{}).value||'fed',gr:(document.getElementById('ngr')||{}).value||''});S.a.sort(function(x,y){return x.name.localeCompare(y.name,'pt-BR')});save();render()}
function delAthlete(id){var a=S.a.find(function(x){return x.id===id});if(!confirm('Remover '+a.name+' e todo o histórico dele?'))return;S.a=S.a.filter(function(x){return x.id!==id});S.p=S.p.filter(function(r){return r.a!==id});for(var dt in S.r){delete S.r[dt][id];if(!Object.keys(S.r[dt]).length)delete S.r[dt]}for(var dn in S.n){delete S.n[dn][id];if(!Object.keys(S.n[dn]).length)delete S.n[dn]}save();render()}

function stats(f){
  var o={};S.a.forEach(function(a){o[a.id]={C:0,I:0,F:0,P:0,D:0,H:0,S:0,bs:0,bc:0}});
  for(var dt in S.r){if(!f(dt))continue;for(var id in S.r[dt]){if(o[id])o[id][S.r[dt][id]]++}}
  for(var dq in S.n){if(!f(dq))continue;for(var iq in S.n[dq]){var bb=S.n[dq][iq].b;if(o[iq]&&bb){o[iq].bs+=bb;o[iq].bc++}}}
  return S.a.map(function(a){var s=o[a.id],n=s.C+s.I+s.F;return {a:a,s:s,n:n,p:n?(s.C+0.5*s.I)/n*100:null,bm:s.bc?s.bs/s.bc:null}});
}
function inPer(dt){return +dt.slice(0,4)===year&&(per==='ano'||Math.floor((+dt.slice(5,7)-1)/3)+1===+per)}
function rankRows(){return stats(inPer).filter(function(r){return passF(r.a,year)}).sort(function(x,y){var px=x.p===null?-1:x.p,py=y.p===null?-1:y.p;return py-px||y.n-x.n||x.a.name.localeCompare(y.a.name,'pt-BR')})}
function perLabel(){return per==='ano'?'Ano '+year:per+'º trimestre de '+year}
function monLabel(){var t=new Date(+mon.slice(0,4),+mon.slice(5,7)-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});return t.charAt(0).toUpperCase()+t.slice(1)}

/* ---------- PDF ---------- */
function pe(s){return String(s).replace(/[^\x00-\xff]/g,'-').replace(/[\\()]/g,'\\$&')}
function mkPDF(W,H){
  var pg=[],c;
  return {

  if(!all.length)return h+'<div class="card mut">Nenhum resultado neste evento ainda.</div>';
  h+='<div class="card"><select onchange="pfa=this.value;render()"><option value="todos">Todos os atletas</option>'+S.a.filter(function(a){return all.some(function(r){return r.a===a.id})}).map(function(a){return '<option value="'+a.id+'"'+(pfa===a.id?' selected':'')+'>'+esc(a.name)+'</option>'}).join('')+'</select></div>';
  all.filter(function(r){return pfa==='todos'||r.a===pfa}).sort(function(x,y){return aName(x.a).localeCompare(aName(y.a),'pt-BR')||evOrd(x.ev)-evOrd(y.ev)}).forEach(function(r){h+=pCard(r,inf)});
  return h}
function chart(pts){
  var W=340,H=210,L=46,R=16,T=24,B=26,t0=new Date(year,0,1).getTime(),t1=new Date(year,11,31).getTime(),fs=pts.map(function(p){return p.f}),mn=Math.min.apply(null,fs),mx=Math.max.apply(null,fs),best=mn;
  if(mx===mn){mn-=100;mx+=100}else{var pad=(mx-mn)*0.2;mn-=pad;mx+=pad}
  function X(d){return L+(pd(d).getTime()-t0)/(t1-t0)*(W-L-R)}
  function Y(f){return T+(f-mn)/(mx-mn)*(H-T-B)}
  var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="Evolução do tempo final">';
  for(var i=0;i<3;i++){var v=mn+(mx-mn)*i/2,y=Y(v);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--bd)"/><text x="'+(L-5)+'" y="'+(y+3)+'" text-anchor="end" font-size="9" style="fill:var(--mut)">'+ft(Math.round(v))+'</text>'}
  'JFMAMJJASOND'.split('').forEach(function(m,k){s+='<text x="'+X(year+'-'+p2(k+1)+'-15')+'" y="'+(H-8)+'" text-anchor="middle" font-size="9" style="fill:var(--mut)">'+m+'</text>'});
  if(pts.length>1)s+='<polyline fill="none" style="stroke:var(--ac)" stroke-width="2" points="'+pts.map(function(p){return X(p.d).toFixed(1)+','+Y(p.f).toFixed(1)}).join(' ')+'"/>';
  pts.forEach(function(p){var x=X(p.d),y=Y(p.f),b=p.f===best,an=x<34?'start':x>W-34?'end':'middle';
    s+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(b?6:4)+'" style="fill:var(--ac);stroke:var(--card)" stroke-width="2"/><text x="'+x.toFixed(1)+'" y="'+(y-9).toFixed(1)+'" text-anchor="'+an+'" font-size="9" style="fill:var(--fg)">'+ft(p.f)+'</text>'});
  return s+'</svg>'}
function pGeral(){
  if(!S.p.length)return '<div class="card mut">Quando você lançar resultados nos eventos, a evolução de cada atleta aparece aqui.</div>';
  var withR=S.a.filter(function(a){return S.p.some(function(r){return r.a===a.id})});
  if(!withR.length)return '<div class="card mut">Nenhum resultado de atleta cadastrado.</div>';
  if(!withR.some(function(a){return a.id===gA}))gA=withR[0].id;
  var mine=S.p.filter(function(r){return r.a===gA}),evs=[];
  mine.forEach(function(r){if(evs.indexOf(r.ev)<0)evs.push(r.ev)});evs.sort(function(x,y){return evOrd(x)-evOrd(y)});
  if(evs.indexOf(gE)<0)gE=evs[0];
  var h='<div class="card"><select onchange="gA=this.value;render()">'+withR.map(function(a){return '<option value="'+a.id+'"'+(gA===a.id?' selected':'')+'>'+esc(a.name)+'</option>'}).join('')+'</select>';
  h+='<div class="row" style="margin-top:8px"><select onchange="gE=this.value;render()" style="flex:2">'+evs.map(function(k){return '<option value="'+k+'"'+(gE===k?' selected':'')+'>'+evLabel(k)+'</option>'}).join('')+'</select><select onchange="gP=this.value;render()" style="flex:1"><option value="25"'+(gP==='25'?' selected':'')+'>25m</option><option value="50"'+(gP==='50'?' selected':'')+'>50m</option></select><input type="number" value="'+year+'" style="flex:1" onchange="year=+this.value||year;render()"></div></div>';
  var pts=mine.filter(function(r){return r.ev===gE&&r.pl===gP&&+r.d.slice(0,4)===year}).sort(function(x,y){return x.d<y.d?-1:x.d>y.d?1:0});
  if(!pts.length){var other=mine.some(function(r){return r.ev===gE&&r.pl!==gP});
    h+='<div class="card mut">Sem resultados em '+evLabel(gE)+' na piscina de '+gP+'m em '+year+'.'+(other?' Há resultados na outra piscina: troque o filtro.':' Tente outro ano.')+'</div>'}
  else{
    h+='<div class="card"><div class="mut" style="margin-bottom:4px">Tempo final em '+evLabel(gE)+' ('+gP+'m), '+year+'. Quanto mais alto no gráfico, mais rápido.</div>'+chart(pts)+'</div>';
    h+='<div class="tw"><table style="width:100%"><tr><th>Data</th><th>Competição</th><th>Tempo</th><th>Variação</th></tr>'+pts.map(function(r,k){var dv=k?r.f-pts[k-1].f:null;return '<tr><td>'+dbr(r.d).slice(0,5)+'</td><td class="wrap">'+esc(r.c||'')+'</td><td><b>'+ft(r.f)+'</b></td><td>'+(dv===null?'':'<span class="'+(dv<0?'good':dv>0?'bad':'')+'">'+(dv===0?'=':fdf(dv))+'</span>')+'</td></tr>'}).join('')+'</table></div>'}
  var bm={};mine.forEach(function(r){var k=r.ev+'|'+r.pl;if(!bm[k]||r.f<bm[k].f)bm[k]=r});
  var ks=Object.keys(bm).sort(function(x,y){return evOrd(bm[x].ev)-evOrd(bm[y].ev)||(bm[x].pl<bm[y].pl?-1:1)});
  h+='<div class="card"><div class="name">Melhores marcas</div><table style="width:100%"><tr><th style="text-align:left">Prova</th><th>Piscina</th><th>Tempo</th><th>Data</th></tr>'+ks.map(function(k){var r=bm[k];return '<tr><td style="text-align:left">'+evLabel(r.ev)+'</td><td>'+r.pl+'m</td><td><b>'+ft(r.f)+'</b></td><td>'+dbr(r.d).slice(0,5)+'</td></tr>'}).join('')+'</table></div>';
  return h}

/* ---------- Telas ---------- */
function render(){
  if(tab==='tabela'||tab==='rank')fsub=tab;
  document.getElementById('nav').innerHTML=TABS.map(function(t){return '<button class="'+(navCur()===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')"><span style="font-size:17px;display:block;line-height:1.25">'+t[2]+'</span>'+t[1]+'</button>'}).join('');
  var h='';
  if(tab==='chamada'){
    var lab=pd(date).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
    var yrC=+date.slice(0,4),gl=grouped(yrC),heads=gl.some(function(g){return g.k!=='sem'}),dr=S.r[date]||{},mk=S.a.filter(function(a){return dr[a.id]}).length;
    h+='<div class="card"><div class="row"><button class="btn ghost" onclick="shift(-1)" aria-label="Dia anterior">‹</button><input type="date" value="'+date+'" onchange="if(this.value){date=this.value;render()}"><button class="btn ghost" onclick="shift(1)" aria-label="Próximo dia">›</button></div>';
    h+='<div class="mut" style="margin:8px 0;text-align:center">'+lab+'. '+mk+' de '+S.a.length+' marcados.</div><div class="g2"'+(heads?' style="grid-template-columns:repeat(3,1fr)"':'')+'>';
    (heads?[]:[['C','✅ Marcar restantes']]).concat([['D','💤 Descanso'],['H','🎉 Feriado'],['P','🏆 Competição']]).forEach(function(b){h+='<button class="btn ghost" onclick="markAll(\''+b[0]+'\')">'+b[1]+'</button>'});
    h+='</div></div><div class="leg">'+KEYS.map(function(k){return SYM[k][0]+' '+SYM[k][1]}).join(' &nbsp; ')+'</div>';
    if(!S.a.length)h+='<div class="card mut">Nenhum atleta ainda. Vá em “Atletas” e cadastre sua equipe.</div>';
    gl.forEach(function(g){
      if(heads)h+='<div class="row" style="margin:16px 0 8px"><div class="grow" style="font-weight:700">'+GRN[g.k]+' <span class="mut">('+g.list.length+')</span></div><button class="btn ghost" style="padding:5px 9px;font-size:13px" onclick="markAll(\'C\',\''+g.k+'\')">✅ Marcar restantes</button></div>';
      g.list.forEach(function(a){
      var cur=dr[a.id];
      h+='<div class="card"><div class="name" style="cursor:pointer" onclick="openAthlete(\''+a.id+'\')">'+esc(a.name)+(lbl(a,yrC)?' <span class="mut" style="font-weight:400">· '+lbl(a,yrC)+'</span>':'')+' <span class="mut">›</span></div><div class="sym">'+KEYS.map(function(k){return '<button class="'+(cur===k?'on':'')+'" aria-label="'+SYM[k][1]+'" onclick="setCode(\''+a.id+'\',\''+k+'\')">'+SYM[k][0]+'</button>'}).join('')+'</div>'+detPanel(a)+'</div>';
    })});
  }
  if(tab==='tabela'){
    h+=fhead();
    var nd=new Date(+mon.slice(0,4),+mon.slice(5,7),0).getDate();
    h+='<div class="card row"><input type="month" value="'+mon+'" onchange="if(this.value){mon=this.value;render()}"><button class="btn" onclick="pdfTable()">PDF</button></div>';
    if(!S.a.length)h+='<div class="card mut">Cadastre atletas na aba “Atletas” para ver a tabela.</div>';
    else{
      var st=fsort(stats(function(dt){return dt.slice(0,7)===mon}),+mon.slice(0,4)),lg=null;
      if(!st.length)h+='<div class="card mut">Nenhum atleta neste filtro.</div>';else{
      h+='<div class="tw"><table><tr><th class="fx">Atleta</th>';
      for(var d=1;d<=nd;d++)h+='<th>'+d+'</th>';
      h+='<th>Freq.</th></tr>';
      st.forEach(function(r){
        var gk=grpOf(r.a,+mon.slice(0,4));if(gk!==lg){lg=gk;h+='<tr><td class="fx" style="max-width:none;overflow:visible;background:var(--sel)">'+GRN[gk]+'</td><td colspan="'+(nd+1)+'" style="background:var(--sel)"></td></tr>'}
        h+='<tr><td class="fx">'+esc(r.a.name)+'</td>';
        for(var d=1;d<=nd;d++){var k=(S.r[mon+'-'+p2(d)]||{})[r.a.id];h+='<td>'+(k?SYM[k][0]:'')+'</td>'}
        h+='<td><b>'+fp(r.p)+'</b></td></tr>';
      });
      h+='</table></div><div class="mut">Deslize para o lado para ver todos os dias.</div>';}
    }
  }
  if(tab==='rank'){
    h+=fhead();
    h+='<div class="card"><div class="row"><select onchange="per=this.value;render()" style="flex:2">';
    [['ano','Ano inteiro'],['1','1º trimestre (jan–mar)'],['2','2º trimestre (abr–jun)'],['3','3º trimestre (jul–set)'],['4','4º trimestre (out–dez)']].forEach(function(p){h+='<option value="'+p[0]+'"'+(per===p[0]?' selected':'')+'>'+p[1]+'</option>'});
    h+='</select><input type="number" value="'+year+'" style="flex:1" onchange="year=+this.value||year;render()"></div>';
    h+='<button class="btn" style="width:100%;margin-top:8px" onclick="pdfRank()">Gerar PDF do ranking</button></div>';
    var rows=rankRows();
    if(!rows.length)h+='<div class="card mut">Nenhum atleta para mostrar. Cadastre atletas, registre treinos ou mude o filtro.</div>';
    else{h+='<div class="card">';
      var medals=['🥇','🥈','🥉'];
      rows.forEach(function(r,i){
        h+='<div class="rk" style="cursor:pointer" onclick="openAthlete(\''+r.a.id+'\')"><div class="pos">'+(r.p!==null&&i<3?medals[i]:i+1)+'</div><div class="grow"><div class="name" style="margin:0">'+esc(r.a.name)+(lbl(r.a,year)?' <span class="mut" style="font-weight:400">· '+lbl(r.a,year)+'</span>':'')+'</div><div class="mut">'+r.s.C+' ✅ &nbsp;'+r.s.I+' 🟡 &nbsp;'+r.s.F+' ❌ &nbsp;'+r.s.P+' 🏆'+(r.s.S?' &nbsp;'+r.s.S+' 🤒':'')+(r.bm!==null?' &nbsp;Borg '+r.bm.toFixed(1).replace('.',','):'')+'</div>'+(r.p!==null?'<div class="bar"><i style="width:'+r.p+'%"></i></div>':'')+'</div><div class="pct">'+fp(r.p)+'</div></div>';
      });
      h+='</div><div class="mut">Completo vale 100%, incompleto 50% e falta 0%. Descanso, feriado, competição e doença/lesão não entram na conta.</div>';
    }
  }
  if(tab==='provas')h+=pTab();
  if(tab==='atleta')h+=athleteView();
  if(tab==='atletas'){
    var SEL=function(id,on,v,o){return '<select'+(id?' id="'+id+'"':'')+(on?' onchange="'+on+'"':'')+'>'+o.map(function(x){return '<option value="'+x[0]+'"'+(v===x[0]?' selected':'')+'>'+x[1]+'</option>'}).join('')+'</select>'};
    var OST=[['fed','Federado'],['pre','Pré-equipe']],OGR=[['','Automático (pela categoria)'],['g1',GRN.g1],['g2',GRN.g2]];
    if(EA){h+='<div class="card"><div class="name">Editar atleta</div><input value="'+esc(EA.n)+'" oninput="EA.n=this.value"><div class="mut" style="margin:8px 0 4px">Data de nascimento</div><input type="date" value="'+EA.b+'" onchange="EA.b=this.value"><div class="g2" style="margin-top:8px"><div><div class="mut" style="margin-bottom:4px">Situação</div>'+SEL('','EA.st=this.value',EA.st,OST)+'</div><div><div class="mut" style="margin-bottom:4px">Grupo de treino</div>'+SEL('','EA.gr=this.value',EA.gr,OGR)+'</div></div><div class="g2" style="margin-top:10px"><button class="btn ghost" onclick="EA=null;render()">Cancelar</button><button class="btn" onclick="saveA()">Salvar</button></div></div>'}
    else{h+='<div class="card"><input id="nm" placeholder="Nome do atleta" onkeydown="if(event.key===\'Enter\')addAthlete()"><div class="mut" style="margin:8px 0 4px">Data de nascimento (define a categoria)</div><input id="nb" type="date"><div class="g2" style="margin-top:8px"><div><div class="mut" style="margin-bottom:4px">Situação</div>'+SEL('nst','','fed',OST)+'</div><div><div class="mut" style="margin-bottom:4px">Grupo de treino</div>'+SEL('ngr','','',OGR)+'</div></div><button class="btn" style="width:100%;margin-top:10px" onclick="addAthlete()">Adicionar atleta</button></div>'}
    if(!S.a.length)h+='<div class="mut">Cadastre seus atletas acima.</div>';
    var yr0=new Date().getFullYear(),g0=grouped(yr0);
    g0.forEach(function(g){
      h+='<div style="font-weight:700;margin:16px 0 8px">'+GRN[g.k]+' <span class="mut">('+g.list.length+')</span></div>';
      g.list.forEach(function(a){h+='<div class="card"><div class="name" style="margin:0">'+esc(a.name)+'</div><div class="mut">'+(a.b?catTxt(a.b,yr0)+' · nasc. '+dbr(a.b):'Sem data de nascimento. Toque em Editar para informar.')+'</div><div class="mut">'+(a.st==='pre'?'Pré-equipe':'Federado')+(a.gr&&a.gr!==autoG(a.b,yr0)?' · treina em outro grupo (definido por você)':'')+'</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px"><button class="btn ghost" onclick="openAthlete(\''+a.id+'\')">Histórico</button><button class="btn ghost" onclick="editA(\''+a.id+'\')">Editar</button><button class="btn ghost" onclick="delAthlete(\''+a.id+'\')">Remover</button></div></div>'})});
    h+='<div class="card" style="margin-top:18px"><div class="name">Backup</div><div class="mut" style="margin-bottom:8px">Seus dados ficam só neste aparelho. Copie o backup de vez em quando e guarde em Notas.</div><button class="btn" onclick="copyBk()">Copiar backup</button><div id="msg" class="mut" style="margin-top:8px"></div>';
    h+='<textarea id="rs" rows="3" style="margin-top:12px" placeholder="Para restaurar, cole o backup aqui"></textarea><div style="margin-top:8px"><button class="btn ghost" onclick="restore()">Restaurar</button></div></div>';
  }
  var tp=tipFor();document.getElementById('main').innerHTML=(tp?'<div class="mut" style="margin:-4px 0 12px">'+tp+'</div>':'')+h;
}
function copyBk(){var t=JSON.stringify(S),m=document.getElementById('msg');
  function fb(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');m.textContent='Backup copiado.'}catch(e){m.textContent='Não foi possível copiar.'}ta.remove()}
  try{navigator.clipboard.writeText(t).then(function(){m.textContent='Backup copiado.'},fb)}catch(e){fb()}}
function restore(){var v=document.getElementById('rs').value.trim();try{var o=JSON.parse(v);if(!o.a||!o.r)throw 0;if(!confirm('Isso substitui os dados atuais. Continuar?'))return;S=o;S.n=S.n||{};S.p=S.p||[];migE();save();tab='chamada';render()}catch(e){alert('Backup inválido. Cole o texto completo copiado.')}}
render();
</script>
