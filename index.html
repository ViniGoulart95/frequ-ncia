<style>
:root{--bg:#f2f4fb;--fg:#121735;--card:#fff;--mut:#5d6590;--ac:#2f3799;--acfg:#fff;--bd:#e1e5f4;--soft:#eceefa;--sel:#e6e9fb;--y:#f6c915;--yb:rgba(246,201,21,.5);--hd:#2f3799;--navbg:rgba(255,255,255,.93);--gd:#1a7f37;--bad:#c2342f}
@media (prefers-color-scheme:dark){:root{--bg:#0d1238;--fg:#eef0ff;--card:#151b4a;--mut:#9aa3d6;--ac:#8c97ff;--acfg:#0d1238;--bd:#262e68;--soft:#202863;--sel:#1d2560;--yb:rgba(246,201,21,.3);--hd:#1b2280;--navbg:rgba(21,27,74,.93);--gd:#5fd38d;--bad:#ff8a80}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.top{position:relative;overflow:hidden;background:var(--hd);color:#fff;border-bottom:3px solid var(--y);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 12px}
.top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.top img{width:42px;height:42px;border-radius:11px;flex:none;display:block}
.brand{font-weight:900;font-style:italic;font-size:21px;letter-spacing:.04em;line-height:1.1}

/* ===== Sincronização entre técnicos (Firebase / Firestore) ===== */
var SYT=null,SYU=null,SYS='',syMode='',FBV='10.12.2',CLOUD=null;
function flat(){var o={},d,id;
  S.a.forEach(function(a){o['a:'+a.id]=JSON.stringify(a)});
  (S.p||[]).forEach(function(r){o['p:'+r.id]=JSON.stringify(r)});
  (S.e||[]).forEach(function(e){o['e:'+e.id]=JSON.stringify(e)});
  for(d in S.r)for(id in S.r[d])o['r:'+d+':'+id]=JSON.stringify(S.r[d][id]);
  for(d in S.n)for(id in S.n[d])o['n:'+d+':'+id]=JSON.stringify(S.n[d][id]);
  for(d in (S.t||{}))for(id in S.t[d])o['t:'+d+':'+id]=JSON.stringify(S.t[d][id]);
  return o}
function applyKey(k,json){
  var q=k.split(':'),ty=q[0],v=json===undefined?undefined:JSON.parse(json),L;
  if(ty==='a'||ty==='p'||ty==='e'){L=ty==='a'?'a':ty;S[L]=(S[L]||[]).filter(function(x){return x.id!==q[1]});if(v!==undefined)S[L].push(v)}
  else if(ty==='r'||ty==='n'||ty==='t'){var M=S[ty]=S[ty]||{},d=M[q[1]];
    if(v===undefined){if(d){delete d[q[2]];if(!Object.keys(d).length)delete M[q[1]]}}
    else{if(!d)d=M[q[1]]={};d[q[2]]=v}}}
function syPersist(now){if(!SY)return;clearTimeout(SYT);
  function w(){try{localStorage.setItem('freq-natacao-sync',JSON.stringify({cfg:SY.cfg,team:SY.team,meta:SY.meta,last:SY.last,init:SY.init}))}catch(e){}}
  if(now)w();else SYT=setTimeout(w,400)}
function syStatus(t){SYS=t;var e=document.getElementById('syncst');if(e)e.textContent=t;var h=document.getElementById('hsub');if(h)h.textContent='Frequência e resultados'+(SY?' · ☁️ '+t:'')}
function softRender(){var a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){SY.dirty=true;return}render()}
function syPush(){
  if(!SY||!SY.ready)return;clearTimeout(SYQ);
  var cur=flat(),list=[],now=Date.now(),k,t;
  for(k in cur)if(SY.last[k]!==cur[k]){t=Math.max(now,(SY.meta[k]||0)+1);SY.meta[k]=t;list.push({k:k,v:cur[k],t:t,d:false})}
  for(k in SY.last)if(cur[k]===undefined){t=Math.max(now,(SY.meta[k]||0)+1);SY.meta[k]=t;list.push({k:k,v:null,t:t,d:true})}
  SY.last=cur;
  if(list.length){CLOUD.write(list);syPersist()}}
function syDocs(list,fromServer,pending){
  if(!SY)return;var keys=[];
  list.forEach(function(x){if((SY.meta[x.k]||0)>=x.t)return;SY.meta[x.k]=x.t;applyKey(x.k,x.d?undefined:x.v);keys.push(x.k)});
  if(keys.length){
    S.a.sort(function(x,y){return x.name.localeCompare(y.name,'pt-BR')});
    var cur=flat();keys.forEach(function(k){if(cur[k]===undefined)delete SY.last[k];else SY.last[k]=cur[k]});
